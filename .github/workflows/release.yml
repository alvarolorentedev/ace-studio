name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macos}
          - {os: windows-2025, target: windows}
          - {os: ubuntu-24.04, target: linux}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/stage_runtime.py
      - run: uv run flet build ${{ matrix.target }} --yes --output build/${{ matrix.target }}
      - name: Verify packaged runtime helpers
        run: uv run python -c "import sys; from pathlib import Path; root = Path('build/python-app/assets/bin'); assert (root / ('uv.exe' if sys.platform == 'win32' else 'uv')).is_file(); assert any(root.glob('ace_studio_bridge.py*'))"
      - if: matrix.target == 'macos'
        run: hdiutil create -volname "ACE Studio" -srcfolder "build/macos/ACE Studio.app" -ov -format UDZO build/ACE-Studio-macOS.dmg
      - if: matrix.target == 'windows'
        shell: pwsh
        run: iscc packaging/windows/ACE-Studio.iss
      - if: matrix.target == 'linux'
        run: bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ace-studio-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build/*.dmg
            build/*.exe
            build/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ace-studio-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
