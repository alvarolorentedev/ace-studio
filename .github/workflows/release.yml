name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macos}
          - {os: windows-2025, target: windows}
          - {os: ubuntu-24.04, target: linux}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: uv sync
      - run: make check
      - run: uv run python scripts/stage_runtime.py
      - run: uv run flet build ${{ matrix.target }} --yes --output build/${{ matrix.target }}
      - name: Verify packaged runtime helpers
        run: uv run python -c "import sys; from pathlib import Path; root = Path('build/python-app/assets/bin'); assert (root / ('uv.exe' if sys.platform == 'win32' else 'uv')).is_file(); assert any(root.glob('ace_studio_bridge.py*'))"
      - name: Install Developer ID certificate
        if: matrix.target == 'macos'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/ace-studio-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Sign macOS app
        if: matrix.target == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          app_path="build/macos/ACE Studio.app"
          entitlements_path="build/flutter/macos/Runner/Release.entitlements"
          find "$app_path" -type f -print0 | while IFS= read -r -d '' file_path; do
            if file "$file_path" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$file_path"
            fi
          done
          codesign --force --deep --options runtime --timestamp --entitlements "$entitlements_path" --sign "$MACOS_SIGNING_IDENTITY" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - name: Create and sign macOS DMG
        if: matrix.target == 'macos'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          hdiutil create -volname "ACE Studio" -srcfolder "build/macos/ACE Studio.app" -ov -format UDZO build/ACE-Studio-macOS.dmg
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/ACE-Studio-macOS.dmg
          codesign --verify --verbose=2 build/ACE-Studio-macOS.dmg
      - name: Notarize macOS DMG
        if: matrix.target == 'macos'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          result_path="$RUNNER_TEMP/notary-result.json"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$api_key_path"
          xcrun notarytool submit build/ACE-Studio-macOS.dmg --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json > "$result_path"
          cat "$result_path"
          submission_id=$(plutil -extract id raw "$result_path")
          if [ "$(plutil -extract status raw "$result_path")" != "Accepted" ]; then
            xcrun notarytool log "$submission_id" --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple build/ACE-Studio-macOS.dmg
          xcrun stapler validate build/ACE-Studio-macOS.dmg
      - if: matrix.target == 'windows'
        shell: pwsh
        run: iscc packaging/windows/ACE-Studio.iss
      - if: matrix.target == 'linux'
        run: bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ace-studio-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build/*.dmg
            build/*.exe
            build/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ace-studio-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
