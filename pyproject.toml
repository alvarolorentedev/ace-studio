[project]
name = "ace-studio"
version = "0.1.0"
description = "A polished desktop client for ACE-Step 1.5 music generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "flet==0.86.5",
    "flet-audio==0.86.5",
    "uv==0.12.8",
]

[project.scripts]
ace-studio = "ace_studio.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_studio"]

[tool.flet]
product = "ACE Studio"
company = "ACE Studio"
description = "AI music creation powered by ACE-Step 1.5"
org = "dev.alvarolorente"
bundle_id = "dev.alvarolorente.ace_studio"

[tool.flet.app]
path = "src"
module = "main.py"

[tool.flet.macos]
artifact = "ACE Studio"

[tool.flet.windows]
artifact = "ACE Studio"

[tool.flet.linux]
artifact = "ace-studio"

[tool.flet.compile]
app = true
packages = true

[tool.flet.flutter.pubspec.dependency_overrides]
# 7.3.1 references NWPath.isUltraConstrained, which requires the macOS 26 SDK.
connectivity_plus = "7.0.0"
